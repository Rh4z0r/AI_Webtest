<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website mit pulsierendem Ausrufezeichen</title>
    <style>
        /* Import der benötigten Schriftarten */
        @font-face {
            font-family: 'Zapfino';
            src: url('assets/Zapfino.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Times New Roman';
            src: url('assets/TimesNewRoman.ttf') format('truetype');
        }

        /* Allgemeine Styling-Regeln */
        body {
            font-family: 'Times New Roman', serif;
            background-color: #f0f0f0;
        }

        /* Styling für das Ausrufezeichen */
        .ausrufezeichen {
            font-family: 'Zapfino', cursive;
            font-size: 64px;
            color: #00698f;
            animation: pulsieren 2s infinite;
        }

        /* Definition der Animation */
        @keyframes pulsieren {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <h1>Willkommen auf meiner Website!</h1>
    <p>Das ist ein Beispieltext.</p>
    <span class="ausrufezeichen">!</span>

    <script>
        // Keine zusätzliche Logik benötigt, da die Animation über CSS definiert ist
    </script>
</body>
</html>
